<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Uma simples aplicação de lista de tarefas"
    />
    <title>To-Do List Simples</title>
    <link rel="stylesheet" href="styles.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <main class="todo-container">
      <h1>Minha To-Do List</h1>
      <div class="input-container">
        <input
          type="text"
          id="taskInput"
          placeholder="Adicione uma nova tarefa..."
          aria-label="Campo para adicionar nova tarefa"
        />
        <button id="addTaskBtn" aria-label="Adicionar tarefa">Adicionar</button>
      </div>
      <ul id="taskList" aria-live="polite"></ul>
    </main>
    <div class="reset-global-container">
      <button id="resetTasksBtn" aria-label="Limpar todas as tarefas">
        Limpar Tudo
      </button>
    </div>
    <script src="script.js" defer></script>
  </body>
</html>
